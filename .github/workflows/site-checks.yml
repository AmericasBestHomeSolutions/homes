name: Site checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: book_links tests
        run: python3 scripts/test_book_links.py
      - name: buyer search, facts, exclusion, placeholders
        run: |
          python3 scripts/test_excluded_homes.py
          python3 scripts/test_home_facts.py
          python3 scripts/test_consistency.py
          python3 scripts/test_placeholders.py
          python3 scripts/test_buyer_search.py
          python3 scripts/test_seo_pages.py
          python3 scripts/test_card_photos.py
